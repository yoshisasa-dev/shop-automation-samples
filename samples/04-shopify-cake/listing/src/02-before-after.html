<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>02 使う前と後</title>
<link rel="stylesheet" href="base.css">
<style>
  h1 { font-size: 60px; margin-top: 26px; }
  .cols { position: absolute; left: 80px; right: 80px; top: 440px; display: flex; gap: 90px; }
  .card { flex: 1; border-radius: 28px; padding: 34px 34px 36px; }
  .before { background: #efe7e2; }
  .after { background: #fff; border: 4px solid var(--accent); box-shadow: 0 14px 34px rgba(194, 82, 92, 0.18); }
  .card h2 { font-size: 40px; font-weight: 800; margin-bottom: 26px; }
  .before h2 { color: var(--sub); }
  .after h2 { color: var(--accent); }
  .card li { list-style: none; font-size: 28px; font-weight: 700; line-height: 1.4; padding: 11px 0 11px 46px; position: relative; }
  .before li::before { content: "×"; position: absolute; left: 0; top: 10px; color: #a8968d; font-size: 36px; }
  .after li::before { content: "✓"; position: absolute; left: 0; top: 10px; color: var(--accent); font-size: 36px; font-weight: 800; }
  .arrow { position: absolute; left: 565px; top: 640px; width: 90px; height: 90px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 54px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(194, 82, 92, 0.35); }
  .band { position: absolute; left: 80px; right: 80px; top: 960px; background: var(--ink); color: #fff; border-radius: 20px; padding: 24px; text-align: center; font-size: 34px; font-weight: 800; }
  .band em { font-style: normal; color: #ffc2c7; }
</style>
</head>
<body>
  <div class="page">
    <span class="chip">こんなお悩みに</span>
    <h1>電話とメモの予約受付を、<br><em>ネットでまるごと</em>受け付けます</h1>
  </div>
  <div class="cols">
    <div class="card before">
      <h2>いま</h2>
      <ul>
        <li>電話で予約を受けてメモ</li>
        <li>日にち・文字の聞きまちがい</li>
        <li>営業時間外は受けられない</li>
        <li>予約の一覧づくりが手間</li>
      </ul>
    </div>
    <div class="card after">
      <h2>導入後</h2>
      <ul>
        <li>24時間ネットで予約できる</li>
        <li>お客さんが日時を入力</li>
        <li>確認メールが自動で届く</li>
        <li>受け取り日も一覧で見られる</li>
      </ul>
    </div>
  </div>
  <div class="arrow">→</div>
  <div class="band">電話の手間と、<em>聞きまちがい</em>を減らします</div>
</body>
</html>
